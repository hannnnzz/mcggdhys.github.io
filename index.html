<body class="bg-[#0f172a] text-gray-100 font-inter min-h-screen flex justify-center items-center p-4">

<div class="main-wrapper w-full max-w-sm relative">
    
    <!-- LOGIN PAGE REMOVED: appPage is default visible -->
    <div id="appPage" class="bg-card-dark p-6 rounded-2xl shadow-xl border border-prime w-full relative">
        
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center border border-prime relative">
                    <img src="logomc.png" class="w-6 h-6 object-contain">
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">

                    </span>

                <div>
                    <h1 class="text-base font-extrabold text-white leading-tight">NEXT MOVE MCGG</h1>

                    <div class="flex items-center gap-2 mt-1">
                        <div id="daysLeftBadge" class="hidden items-center gap-1 text-[10px] bg-gray-800 px-2 py-0.5 rounded border border-gray-700 text-gray-400 font-mono">

                    <div id="mirrorAlert" class="bg-yellow-500/10 text-yellow-500 text-[10px] px-2 py-0.5 rounded border border-yellow-500/20 hidden flex items-center gap-1 animate-pulse font-bold">

                <div class="min-h-[50px] flex items-center justify-center py-2">

                <div class="flex justify-between items-center pt-3 border-t border-gray-700/50 mt-2">

                        <span id="playerCount" class="font-mono font-bold text-gray-300">8 Players</span>

                    <div id="roundStatus" class="flex items-center gap-2 px-2.5 py-1 rounded-md bg-gray-700/50 border border-gray-600 text-[10px] font-bold text-gray-300 uppercase">

            </div>

            <div id="inputSection" class="flex gap-2 transition-all duration-300">
                <input type="text" id="enemyInput" placeholder="Masukkan nama musuh..." autocomplete="off" 
                    class="w-full px-4 py-3.5 rounded-xl bg-gray-700/30 border border-prime text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all font-medium text-sm">
                
                <button id="btnAdd" class="bg-blue-600 hover:bg-blue-500 text-white w-14 rounded-xl flex items-center justify-center shadow-lg btn-press transition-all border-b-4 border-blue-800 active:border-b-0 active:translate-y-1" onclick="addEnemy()">
                    <i class="ph-bold ph-plus text-xl"></i>
                </button>
            </div>

            <div id="controlSection" class="hidden space-y-3 mt-4">
                <button id="btnNext" class="w-full bg-neon-green hover:bg-emerald-400 text-gray-900 py-4 px-5 rounded-xl shadow-lg shadow-green-900/10 btn-press transition-all flex items-center justify-center gap-2 border-b-4 border-emerald-600 active:border-b-0 active:translate-y-1 font-extrabold tracking-wide" onclick="nextRound()">
                    <i class="ph-bold ph-check-circle text-xl"></i> SESUAI PREDIKSI
                </button>
            </div>

            <div class="bg-gray-800/20 rounded-xl p-4 border border-prime">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">
                        DAFTAR ANTRIAN
                    </span>
                </div>
                
                <div id="enemyListContainer" class="space-y-2 max-h-56 overflow-y-auto pr-1 custom-scrollbar">
                    <div class="text-center text-gray-600 py-6 flex flex-col items-center gap-2 border border-dashed border-gray-700 rounded-lg">
                        <span class="text-xs">Belum ada data</span>
                    </div>
                </div>
            </div>

            <button id="btnReset" class="w-full py-4 text-sm font-bold text-white bg-red-600 hover:bg-red-500 rounded-xl shadow-lg shadow-red-500/20 transition-all flex items-center justify-center gap-2 mt-4 btn-press border-b-4 border-red-800 active:border-b-0 active:translate-y-1" onclick="resetAll()">
                <i class="ph-bold ph-arrows-counter-clockwise text-lg"></i>
                    Mulai Game Baru
            </button>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="customModal" class="fixed inset-0 z-[100] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div id="modalBackdrop" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm transition-opacity opacity-0"></div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            
            <div id="modalPanel" class="relative transform overflow-hidden rounded-2xl bg-card-dark text-left shadow-2xl transition-all sm:my-8 w-full max-w-xs border border-prime ring-1 ring-white/5 scale-95 opacity-0">
                
                <div class="bg-gray-800/30 px-4 pt-6 pb-4 flex flex-col items-center border-b border-prime">
                    <div id="modalIconContainer" class="mx-auto flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-full bg-gray-700/30 mb-3 transition-colors duration-300 border border-gray-600">
                        <i id="modalIcon" class="ph-duotone ph-info text-2xl text-gray-300"></i>
                    </div>
                    <h3 class="text-lg font-bold leading-6 text-white" id="modalTitle">Judul Modal</h3>
                </div>

                <div class="px-6 py-4">
                    <p class="text-sm text-gray-300 text-center leading-relaxed" id="modalMessage">
                        Pesan modal...
                    </p>
                </div>

                <div id="modalFooterContainer" class="px-6 pb-6 pt-2 grid grid-cols-1 gap-3 w-full">
                    
                    <button type="button" id="btnCancel" class="hidden w-full justify-center rounded-xl bg-gray-700 px-3 py-3 text-sm font-bold text-gray-300 shadow-sm hover:bg-gray-600 transition-all btn-press border border-gray-600">
                        Batal
                    </button>
                    
                    <button type="button" id="btnConfirm" class="inline-flex w-full justify-center items-center rounded-xl px-3 py-3 text-sm font-bold text-white shadow-lg transition-all btn-press border-b-4 border-blue-800 bg-blue-600 active:border-b-0 active:translate-y-1">
                        OK, Siap
                    </button>
                    
                </div>
            </div>

        </div>
    </div>
</div>

<!-- INLINE SCRIPT: logic tanpa akses kode -->
<script>
/* ===========================
   STATE
   =========================== */
let enemies = [];
let currentIndex = 0;
let isFull = false;
let markDeadIndex = -1;

/* ===========================
   HAPTIC
   =========================== */
function triggerHaptic() {
    if (navigator.vibrate) navigator.vibrate(15);
}

/* ===========================
   MODAL (re-usable)
   =========================== */
function showModal(title, message, confirmHandler, theme = 'info', isConfirmation = true, customText = null) {
    const modal = document.getElementById('customModal');
    const backdrop = document.getElementById('modalBackdrop');
    const panel = document.getElementById('modalPanel');

    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;

    const btnConfirm = document.getElementById('btnConfirm');
    const btnCancel = document.getElementById('btnCancel');
    const iconContainer = document.getElementById('modalIconContainer');
    const icon = document.getElementById('modalIcon');
    const footerContainer = document.getElementById('modalFooterContainer') || btnConfirm.parentElement;

    const baseBtnClass = "inline-flex w-full justify-center items-center rounded-xl px-4 py-3.5 text-sm font-bold text-white shadow-lg transition-all btn-press border-b-4 active:border-b-0 active:translate-y-1 ";
    iconContainer.className = "mx-auto flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-full mb-3 transition-colors duration-300 border-2 shadow-inner ";

    let themeClasses = "";
    let defaultText = "";

    if (theme === 'danger') {
        themeClasses = "bg-red-600 hover:bg-red-500 border-red-800 shadow-red-900/20";
        iconContainer.classList.add('bg-red-500/10', 'border-red-500/20');
        icon.className = "ph-duotone ph-warning-octagon text-3xl text-red-500";
        defaultText = `<i class="ph-bold ph-trash mr-2"></i> Hapus`;
    } else if (theme === 'warning') {
        themeClasses = "bg-yellow-500 hover:bg-yellow-400 border-yellow-700 shadow-yellow-900/20 text-white";
        iconContainer.classList.add('bg-yellow-500/10', 'border-yellow-500/20');
        icon.className = "ph-duotone ph-hand-palm text-3xl text-yellow-500";
        defaultText = `<i class="ph-bold ph-hand-palm mr-2"></i> Tahan`;
    } else {
        themeClasses = "bg-blue-600 hover:bg-blue-500 border-blue-800 shadow-blue-900/20";
        iconContainer.classList.add('bg-blue-500/10', 'border-blue-500/20');
        icon.className = "ph-duotone ph-info text-3xl text-blue-500";
        defaultText = "OK, Siap";
    }

    btnConfirm.className = baseBtnClass + themeClasses;
    btnConfirm.innerHTML = isConfirmation ? (customText || defaultText) : "OK, Siap";

    // replace handler safely
    const newConfirm = btnConfirm.cloneNode(true);
    btnConfirm.parentNode.replaceChild(newConfirm, btnConfirm);
    newConfirm.onclick = () => {
        triggerHaptic();
        confirmHandler();
    };

    if (btnCancel) {
        btnCancel.onclick = () => {
            triggerHaptic();
            hideModal();
        };
    }

    if (isConfirmation) {
        if (btnCancel) btnCancel.classList.remove('hidden');
        footerContainer.classList.remove('grid-cols-1');
        footerContainer.classList.add('grid-cols-2');
    } else {
        if (btnCancel) btnCancel.classList.add('hidden');
        footerContainer.classList.remove('grid-cols-2');
        footerContainer.classList.add('grid-cols-1');
    }

    modal.classList.remove('hidden');
    requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        panel.classList.remove('scale-95', 'opacity-0');
        panel.classList.add('scale-100', 'opacity-100');
    });
}

function hideModal() {
    const modal = document.getElementById('customModal');
    const backdrop = document.getElementById('modalBackdrop');
    const panel = document.getElementById('modalPanel');

    backdrop.classList.add('opacity-0');
    panel.classList.remove('scale-100', 'opacity-100');
    panel.classList.add('scale-95', 'opacity-0');

    setTimeout(() => {
        modal.classList.add('hidden');
    }, 200);
}

/* ===========================
   APP LOGIC
   =========================== */
function doLogout() {
    // no server/session — just confirm and reload
    triggerHaptic();
    showModal(
        'Konfirmasi Keluar',
        'Yakin mau keluar? Semua progress saat ini akan hilang.',
        () => {
            hideModal();
            location.reload();
        },
        'danger', true, `<i class="ph-bold ph-sign-out mr-2"></i> Keluar`
    );
}

function resetAll() {
    triggerHaptic();
    showModal(
        'Reset Game',
        'Mulai game baru? Data musuh akan dihapus.',
        () => {
            hideModal();
            enemies = [];
            currentIndex = 0;
            isFull = false;
            markDeadIndex = -1;

            const controlSec = document.getElementById('controlSection');
            controlSec.style.opacity = '0';
            setTimeout(() => {
                controlSec.classList.add('hidden');
                const inputSec = document.getElementById('inputSection');
                inputSec.classList.remove('hidden');
                requestAnimationFrame(() => { inputSec.style.opacity = '1'; });
            }, 300);

            document.getElementById('predictionDisplay').innerText = "...";
            updateStatusBadge('INPUT');
            renderList();
            updateInfo();
        },
        'danger', true, `<i class="ph-bold ph-arrows-counter-clockwise mr-2"></i> Reset`
    );
}

function metMirror() {
    triggerHaptic();
    showModal('Rotasi Ditahan', 'Bertemu Mirror / Creep? Rotasi target tidak akan berubah.', () => {
        const display = document.getElementById('predictionDisplay');
        display.classList.add('text-yellow-400', 'blur-[2px]');
        setTimeout(() => {
            display.classList.remove('text-yellow-400', 'blur-[2px]');
        }, 500);
        hideModal();
    }, 'warning');
}

function markDead(index) {
    triggerHaptic();
    markDeadIndex = index;
    const name = enemies[index].name;
    showModal('Eliminasi', `Yakin ${name} sudah mati?`, () => {
        hideModal();
        if (markDeadIndex !== -1) {
            enemies[markDeadIndex].isDead = true;
            renderList();
            if (isFull) showPrediction();
        }
        markDeadIndex = -1;
    }, 'danger');
}

function addEnemy() {
    const input = document.getElementById('enemyInput');
    const name = input.value.trim();
    if (!name) return;

    triggerHaptic();
    enemies.push({ name: name, isDead: false });
    input.value = "";
    input.focus();

    renderList();
    updateInfo();

    const listContainer = document.getElementById('enemyListContainer');
    listContainer.scrollTo({ top: listContainer.scrollHeight, behavior: 'smooth' });

    if (enemies.length === 7) startPredictionMode();
}

function startPredictionMode() {
    isFull = true;
    const inputSec = document.getElementById('inputSection');
    const controlSec = document.getElementById('controlSection');

    inputSec.style.opacity = '0';
    setTimeout(() => {
        inputSec.classList.add('hidden');
        controlSec.classList.remove('hidden');
        controlSec.style.opacity = '0';
        controlSec.style.transform = 'translateY(10px)';
        requestAnimationFrame(() => {
            controlSec.style.transition = 'all 0.5s ease';
            controlSec.style.opacity = '1';
            controlSec.style.transform = 'translateY(0)';
        });
    }, 300);

    showPrediction();
}

function nextRound() {
    triggerHaptic();
    if (!isFull) return;
    currentIndex++;
    if (currentIndex >= enemies.length) currentIndex = 0;
    showPrediction();
}

function showPrediction() {
    if (!isFull) return;
    const target = enemies[currentIndex];
    const display = document.getElementById('predictionDisplay');

    display.className = "w-full transition-all duration-300";

    if (target.isDead) {
        updateStatusBadge('GHOST');
        display.innerHTML = `
            <div class="flex flex-col items-center justify-center py-2 animate-pulse opacity-70">
                <div class="flex items-center gap-2 text-purple-400 mb-1">
                     <i class="ph-duotone ph-ghost text-xl"></i>
                     <span class="text-xl font-bold tracking-wider">MIRROR RANDOM</span>
                </div>
                <span class="text-[10px] text-purple-300/50 uppercase tracking-widest font-mono">Mirror Potensial</span>
            </div>
        `;
    } else {
        updateStatusBadge('PREDICTION');
        display.innerHTML = `<div class="text-3xl font-black text-white tracking-tight drop-shadow-md break-words leading-tight text-center">${target.name}</div>`;
    }
    renderList();
}

function setManualTarget(index) {
    triggerHaptic();
    const targetName = enemies[index].name;
    showModal('Koreksi Target', `Paksa target ronde ini ke ${targetName}?`, () => {
        currentIndex = index;
        showPrediction();
        hideModal();
    }, 'warning');
}

/* ===========================
   RENDER & INFO
   =========================== */
function updateInfo() {
    const aliveEnemies = enemies.filter(e => !e.isDead).length;
    const totalAlive = aliveEnemies + 1;
    const isGanjil = totalAlive % 2 !== 0;

    const countEl = document.getElementById('playerCount');
    countEl.innerText = `${totalAlive} Players`;

    const alertBox = document.getElementById('mirrorAlert');
    if (isGanjil && isFull) alertBox.classList.remove('hidden');
    else alertBox.classList.add('hidden');
}

function updateStatusBadge(type) {
    const statusEl = document.getElementById('roundStatus');
    const baseClass = "flex items-center gap-2 px-2.5 py-1 rounded-md border text-[10px] font-bold uppercase transition-all duration-300";

    if (type === 'INPUT') {
        statusEl.className = baseClass + " bg-gray-700/50 border-gray-600 text-gray-300";
        statusEl.innerText = "INPUT FASE";
    } else if (type === 'PREDICTION') {
        statusEl.className = baseClass + " bg-emerald-500/10 border-emerald-500/30 text-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.1)]";
        statusEl.innerText = "TARGET AKTIF";
    } else if (type === 'GHOST') {
        statusEl.className = baseClass + " bg-purple-500/10 border-purple-500/30 text-purple-400";
        statusEl.innerHTML = `<i class="ph-fill ph-ghost text-xs"></i> GHOST SLOT`;
    }
}

function renderList() {
    const container = document.getElementById('enemyListContainer');
    container.innerHTML = "";

    if (enemies.length === 0) {
        container.innerHTML = `
            <div class="text-center text-gray-600 py-6 flex flex-col items-center gap-2 border border-dashed border-gray-700 rounded-lg m-1">
                <i class="ph-duotone ph-list-dashes text-2xl opacity-40"></i>
                <span class="text-xs font-medium">Belum ada data</span>
            </div>`;
        return;
    }

    enemies.forEach((enemy, index) => {
        const isTarget = (isFull && index === currentIndex);
        const div = document.createElement('div');

        let wrapperClass = "flex justify-between items-center p-3 rounded-lg border transition-all duration-300 relative overflow-hidden group mb-1.5 ";

        if (enemy.isDead) {
            wrapperClass += "bg-[#0f1115] border-dashed border-red-500/10 opacity-60 hover:opacity-100 hover:border-red-500/30";
        } else if (isTarget) {
            wrapperClass += "bg-emerald-900/20 border-emerald-500/40 shadow-[0_0_10px_rgba(16,185,129,0.05)]";
        } else {
            wrapperClass += "bg-gray-800/40 border-gray-700/50 hover:bg-gray-800";
        }

        div.className = wrapperClass;
        div.innerHTML = `
            ${isTarget ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-emerald-500"></div>' : ''}
            <div class="flex items-center gap-3 overflow-hidden pl-1">
                <span class="text-[10px] font-mono w-4 ${enemy.isDead ? 'text-gray-700' : 'text-gray-500'}">#${index + 1}</span> 
                <div class="flex flex-col">
                    <span class="text-sm font-bold truncate max-w-[120px] ${enemy.isDead ? 'line-through text-red-900/50 decoration-red-900/50' : 'text-gray-200'}">
                        ${enemy.name}
                    </span>
                    ${isTarget 
                        ? (enemy.isDead 
                            ? '<span class="text-[9px] text-purple-400 font-bold uppercase tracking-wider flex items-center gap-1"><i class="ph-fill ph-ghost"></i> Ghost</span>' 
                            : '<span class="text-[9px] text-emerald-400 font-bold uppercase tracking-wider flex items-center gap-1"><i class="ph-fill ph-crosshair"></i> Target</span>')
                        : (enemy.isDead ? '<span class="text-[9px] text-gray-600 font-mono">Eliminated</span>' : '')}
                </div>
            </div>
            <div class="flex gap-2 z-10">
                ${!enemy.isDead && isFull && !isTarget ? 
                    `<button class="w-7 h-7 rounded-md bg-gray-700/50 hover:bg-emerald-600 text-gray-400 hover:text-white transition-all flex items-center justify-center border border-gray-600 hover:border-emerald-500 btn-press" onclick="setManualTarget(${index})">
                        <i class="ph-bold ph-crosshair-simple"></i>
                    </button>` : ''
                }
                ${!enemy.isDead ? 
                    `<button class="w-7 h-7 rounded-md bg-gray-700/50 hover:bg-red-500 text-gray-400 hover:text-white transition-all flex items-center justify-center border border-gray-600 hover:border-red-500 btn-press" onclick="markDead(${index})">
                        <i class="ph-bold ph-skull"></i>
                    </button>` : 
                    '<div class="w-7 h-7 flex items-center justify-center"><i class="ph-fill ph-skull text-gray-800 text-lg"></i></div>'
                }
            </div>
        `;
        container.appendChild(div);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    // ensure app visible (in case you previously had login markup)
    const app = document.getElementById('appPage');
    if (app) app.classList.remove('hidden');

    // Enter to add enemy
    const enemyInput = document.getElementById('enemyInput');
    if (enemyInput) {
        enemyInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !document.getElementById("inputSection").classList.contains('hidden')) {
                e.preventDefault();
                addEnemy();
            }
        });
    }

    // initial render
    updateStatusBadge('INPUT');
    renderList();
    updateInfo();
});
</script>

</body>
</html>
